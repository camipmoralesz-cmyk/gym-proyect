<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes | Fitness Retro Chillán</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body-wrapper">

    <!-- Contenedor general centrado -->
    <div class="d-flex flex-column align-items-center justify-content-center w-100 px-3 py-5 min-vh-100">
        
        <!-- TÍTULO GRANDE FUERA DEL CUADRO -->
        <div class="text-center mb-3">
            <h1 class="fw-bold text-light display-5 mb-1">Fitness Retro Chillán</h1>
            <p class="text-secondary">Crea tu cuenta de socio</p>
        </div>

        <!-- TARJETA DE REGISTRO -->
        <div class="login-card shadow-lg">
            <div class="text-center mb-3">
                <div class="fs-2 text-accent mb-1">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h4 class="fw-bold text-light">Registro de Cliente</h4>
            </div>

            <!-- MENSAJES DE ERROR / NOTIFICACIONES DE DJANGO -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Formulario de Registro con POST -->
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-secondary small">Nombre de usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="Elige un nombre de usuario" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control bg-dark text-light border-secondary" placeholder="correo@ejemplo.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" name="password1" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key-fill"></i></span>
                        <input type="password" name="password2" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-warning-retro w-100 py-2 fw-bold">Registrarse</button>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <span class="text-secondary small">¿Ya tienes una cuenta? </span>
                <a href="{% url 'core:login' %}" class="text-decoration-none text-warning small fw-bold">Inicia sesión aquí</a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
