<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Fitness Retro</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body-wrapper">

    <!-- Contenedor general centrado -->
    <div class="d-flex flex-column align-items-center justify-content-center w-100 px-3">
        
        <!-- TÍTULO GRANDE FUERA DEL CUADRO -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-light display-5 mb-1">Fitness Retro Chillán</h1>
            <p class="text-secondary">¡Bienvenidos!</p>
        </div>

        

        <!-- TARJETA DE INICIO DE SESIÓN -->
        <div class="login-card shadow-lg">
            <div class="text-center mb-4">
                <div class="fs-2 text-accent mb-1">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h4 class="fw-bold text-light">Ingresar al Sistema</h4>
            </div>



            <!-- Formulario con POST -->
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary small">Ingrese su nombre de usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="Ingrese su usuario" required>
                    </div>
                </div>

                <!-- Campo de Contraseña con Validación en Tiempo Real -->
                <div class="mb-4">
                    <label class="form-label text-secondary small">Ingrese su contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" id="password-input" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>

                        <!-- Mensaje de advertencia dinámico -->
                        <div id="password-warning" class="form-text text-danger small d-none mt-1">
                            <i class="bi bi-exclamation-triangle me-1"></i> La contraseña es muy corta. Se requiere una contraseña más larga (mínimo 8 caracteres).
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-warning-retro w-100 py-2">Iniciar Sesión</button>
                <div class="text-center mt-4 pt-3 border-top border-secondary">
                    <span class="text-secondary small">¿No tienes cuenta aún?</span>
                    <a href="#" class="text-decoration-none text-warning small fw-bold">Regístrate aquí</a>
                </div>
            </form>
            
        </div>

    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password-input');
        const passwordWarning = document.getElementById('password-warning');

        if (passwordInput && passwordWarning) {
            passwordInput.addEventListener('input', function() {
                const password = passwordInput.value;
                
                // Si escribe algo pero tiene menos de 8 caracteres
                if (password.length > 0 && password.length < 8) {
                    passwordWarning.classList.remove('d-none');
                    passwordInput.classList.add('border-danger');
                    passwordInput.classList.remove('border-secondary');
                } else {
                    // Si está vacío o cumple con la longitud mínima
                    passwordWarning.classList.add('d-none');
                    passwordInput.classList.remove('border-danger');
                    passwordInput.classList.add('border-secondary');
                }
            });
        }
    });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
