<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Fitness Retro</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body-wrapper">

    <!-- Contenedor general centrado -->
    <div class="d-flex flex-column align-items-center justify-content-center w-100 px-3">
        
        <!-- TÍTULO GRANDE FUERA DEL CUADRO -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-light display-5 mb-1">Fitness Retro Chillán</h1>
            <p class="text-secondary">¡Bienvenidos!</p>
        </div>

        <!-- TARJETA DE INICIO DE SESIÓN -->
        <div class="login-card shadow-lg">
            <div class="text-center mb-4">
                <div class="fs-2 text-accent mb-1">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h4 class="fw-bold text-light">Ingresar al Sistema</h4>
            </div>

            <!-- Alerta de error limpia y única -->
            {% if messages %}
                <div class="alert alert-danger mb-3 py-2 text-center" role="alert">
                    {% for message in messages %}
                        {% if forloop.first %}
                            <small class="d-block">{{ message }}</small>
                        {% endif %}
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Formulario único apuntando a la ruta unificada -->
            <form method="POST" action="{% url 'core:login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary small">Ingrese su nombre de usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" placeholder="Ingrese su usuario" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small">Ingrese su contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-warning-retro w-100 py-2">Iniciar Sesión</button>
                <div class="text-center mt-4 pt-3 border-top border-secondary">
                    <span class="text-secondary small">¿No tienes cuenta aún?</span>
                    <a href="{% url 'core:registro' %}" class="text-decoration-none text-warning small fw-bold">Regístrate aquí</a>
                </div>
            </form>
            
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
