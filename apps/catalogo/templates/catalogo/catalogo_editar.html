{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-4">
    <!-- Cabecera de la sección -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-body mb-1">Editar Máquina</h2>
            <p class="text-secondary small mb-0">Modifique los datos del equipo seleccionado en el catálogo.</p>
        </div>
        <div>
            <a href="{% url 'catalogo:gestion_maquinas' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver al Catálogo
            </a>
        </div>
    </div>

    <!-- Formulario de Edición -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4 p-md-5 shadow-sm border-secondary">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <!-- Nombre -->
                        <div class="col-md-12">
                            <label class="form-label text-secondary small fw-semibold">Nombre de la Máquina</label>
                            <input type="text" name="nombre" value="{{ maquina.nombre|default:'' }}" class="form-control bg-transparent text-body border-secondary" required>
                        </div>

                        <!-- Descripción -->
                        <div class="col-md-12">
                            <label class="form-label text-secondary small fw-semibold">Descripción</label>
                            <textarea name="descripcion" rows="3" class="form-control bg-transparent text-body border-secondary">{{ maquina.descripcion|default:'' }}</textarea>
                        </div>

                        <!-- Instrucciones -->
                        <div class="col-md-12">
                            <label class="form-label text-secondary small fw-semibold">Instrucciones de Uso</label>
                            <textarea name="instruccionesUso" rows="3" class="form-control bg-transparent text-body border-secondary">{{ maquina.instruccionesUso|default:'' }}</textarea>
                        </div>

                        <!-- Estado -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-semibold">Estado Operativo</label>
                            <select name="estadoDisponible" class="form-select bg-body text-body border-secondary">
                                <option value="True" {% if maquina.estadoDisponible %}selected{% endif %}>Disponible</option>
                                <option value="False" {% if maquina and not maquina.estadoDisponible %}selected{% endif %}>No Disponible (En Mantención)</option>
                            </select>
                        </div>

                        <!-- Carga de Imagen y Opción de Eliminar -->
                        <div class="col-md-6">
                            <label class="form-label text-secondary small fw-semibold">Imagen de la Máquina</label>
                            <input type="file" name="imagen" class="form-control bg-transparent text-body border-secondary" accept="image/*">
                            
                            {% if maquina.imagen %}
                                <div class="form-text text-success small mt-1">Imagen actual registrada. Sube otra para reemplazarla.</div>
                                <div class="form-check mt-2">
                                    <input class="form-check-input bg-dark border-secondary" type="checkbox" name="eliminar_imagen" id="eliminarImagen">
                                    <label class="form-check-label text-danger small" for="eliminarImagen">
                                        Eliminar imagen actual
                                    </label>
                                </div>
                            {% endif %}
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-end gap-2 pt-4 mt-4 border-top border-secondary">
                        <a href="{% url 'catalogo:gestion_maquinas' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-warning-retro px-4 fw-semibold">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
